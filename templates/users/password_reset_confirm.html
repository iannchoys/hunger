{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Tenor+Sans&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
    >

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

    <main class="password-reset-page">
        <div class="password-reset-page__box">
            <h1 class="password-reset-page__brand">
                Hungry people
            </h1>

            <h2 class="password-reset-page__title">
                Reset Password
            </h2>

            {% if reset_request.is_used %}
                <p class="password-reset-page__status password-reset-page__status--error">
                    This reset link has already been used.
                </p>
            {% elif reset_request.is_expired %}
                <p class="password-reset-page__status password-reset-page__status--error">
                    This reset link has expired.
                </p>
            {% else %}
                <form
                    class="password-reset-page__form"
                    id="resetPasswordConfirmForm"
                    method="post"
                    data-url="{% url 'users:password_reset_change' reset_request.token %}"
                >
                    {% csrf_token %}

                    <input
                        class="password-reset-page__field"
                        type="email"
                        value="{{ reset_request.email }}"
                        readonly
                    >

                    <input
                        class="password-reset-page__field"
                        type="password"
                        name="password"
                        placeholder="New password"
                        required
                    >

                    <input
                        class="password-reset-page__field"
                        type="password"
                        name="password_confirm"
                        placeholder="Confirm password"
                        required
                    >

                    <button class="password-reset-page__button" type="submit">
                        SUBMIT
                    </button>

                    <p
                        class="password-reset-page__status"
                        id="resetPasswordConfirmStatus"
                    ></p>
                </form>
            {% endif %}

            <a class="password-reset-page__login" href="/">
                Login
            </a>
        </div>
    </main>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
